<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FairwayOS</title>
  <script>
    // GitHub Pages SPA redirect: encode the path into the query string
    // so the main index.html can restore it via history.replaceState.
    var l = window.location;
    var seg = l.pathname.split('/');
    var base = seg.length > 1 ? '/' + seg[1] : '';
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      base + '/?p=' + encodeURIComponent(l.pathname.slice(base.length) + l.search) +
      (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
